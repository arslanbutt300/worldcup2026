<script>
const API_GAMES    = 'https://worldcup26.ir/get/games';
const API_STADIUMS = 'https://worldcup26.ir/get/stadiums';

const FLAGS = {
  'Mexico':'🇲🇽','South Africa':'🇿🇦','South Korea':'🇰🇷','Czech Republic':'🇨🇿',
  'Canada':'🇨🇦','Bosnia & Herzegovina':'🇧🇦','Qatar':'🇶🇦','Switzerland':'🇨🇭',
  'Brazil':'🇧🇷','Morocco':'🇲🇦','Haiti':'🇭🇹','Scotland':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','Australia':'🇦🇺',
  'Türkiye':'🇹🇷','Germany':'🇩🇪','Curaçao':'🇨🇼','Netherlands':'🇳🇱','Japan':'🇯🇵',
  'Ivory Coast':'🇨🇮','Ecuador':'🇪🇨','Sweden':'🇸🇪','Tunisia':'🇹🇳','Spain':'🇪🇸',
  'Cape Verde':'🇨🇻','Belgium':'🇧🇪','Egypt':'🇪🇬','Saudi Arabia':'🇸🇦','Uruguay':'🇺🇾',
  'Iran':'🇮🇷','New Zealand':'🇳🇿','France':'🇫🇷','Senegal':'🇸🇳','Iraq':'🇮🇶',
  'Norway':'🇳🇴','Argentina':'🇦🇷','Algeria':'🇩🇿','Austria':'🇦🇹','Jordan':'🇯🇴',
  'Portugal':'🇵🇹','DR Congo':'🇨🇩','England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Croatia':'🇭🇷','Ghana':'🇬🇭',
  'Panama':'🇵🇦','Uzbekistan':'🇺🇿','Colombia':'🇨🇴','USA':'🇺🇸','Paraguay':'🇵🇾','United States':'🇺🇸',
};
function flag(t) { return FLAGS[t] || '🏳'; }

async function loadData() {
  const content = document.getElementById('main-content');
  try {
    const [gamesRes] = await Promise.all([
      fetch(API_GAMES + '?t=' + Date.now())
    ]);
    if (!gamesRes.ok) throw new Error('HTTP ' + gamesRes.status);
    const gamesData = await gamesRes.json();
    const raw = Array.isArray(gamesData) ? gamesData : (gamesData.games || []);

    const groups = {};
    const standings = {};

    raw.filter(g => g.type === 'group').forEach(g => {
      const groupKey = `Group ${g.group}`;
      if (!groups[groupKey]) groups[groupKey] = new Set();
      groups[groupKey].add(g.home_team_name_en);
      groups[groupKey].add(g.away_team_name_en);

      if (g.finished === 'TRUE') {
        const s1 = parseInt(g.home_score) || 0;
        const s2 = parseInt(g.away_score) || 0;
        [g.home_team_name_en, g.away_team_name_en].forEach(t => {
          if (!standings[t]) standings[t] = { p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 };
        });
        const t1 = standings[g.home_team_name_en], t2 = standings[g.away_team_name_en];
        t1.p++; t2.p++;
        t1.gf += s1; t1.ga += s2; t2.gf += s2; t2.ga += s1;
        if (s1 > s2) { t1.w++; t1.pts+=3; t2.l++; }
        else if (s1 < s2) { t2.w++; t2.pts+=3; t1.l++; }
        else { t1.d++; t1.pts++; t2.d++; t2.pts++; }
      }
    });

    let html = '';
    Object.keys(groups).sort().forEach(group => {
      const teams = [...groups[group]].sort();
      html += `<section class="group-section" aria-label="${group}">
        <h2 class="group-title">${group}</h2>
        <div class="teams-grid">`;
      teams.forEach(team => {
        const s = standings[team];
        html += `<div class="team-card">
          <span class="team-flag" aria-hidden="true">${flag(team)}</span>
          <div class="team-name-display">${team}</div>
          ${s
            ? `<div class="team-stats">${s.p} played · ${s.gf} scored · ${s.ga} conceded</div>
               <div class="team-pts">${s.pts} pts</div>`
            : `<div class="team-stats">No matches played yet</div>`}
        </div>`;
      });
      html += `</div></section>`;
    });

    content.innerHTML = html || '<div class="loading">No team data available yet.</div>';
  } catch(err) {
    content.innerHTML = '<div class="loading">⚠ Could not load team data. <button onclick="loadData()" style="color:var(--accent);background:none;border:none;cursor:pointer;">Retry</button></div>';
    console.error('WorldCup26 teams load error:', err);
  }
}
loadData();
setInterval(loadData, 60000);
</script>
