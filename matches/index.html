  .match-card:hover { border-color: var(--border2); }
  .match-card.completed { border-left: 3px solid var(--accent); }
  .match-card.live-match { border-left: 3px solid var(--red); background: #1a0f0f; }
  .match-card.upcoming { border-left: 3px solid var(--border2); }
  .match-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .match-group { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }

  .status-live { background: rgba(239,68,68,0.2); color: var(--red); }
  .status-upcoming { background: rgba(255,255,255,0.06); color: var(--text3); }
  .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .team-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .team-name.home { text-align: right; }
  .team-name.away { text-align: left; }
  .score-box { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 6px 14px; text-align: center; min-width: 70px; }
  .score-value { font-size: 20px; font-weight: 800; letter-spacing: 2px; color: var(--text); }
  .score-ht { font-size: 10px; color: var(--text3); margin-top: 1px; }
  .score-vs { font-size: 13px; color: var(--text3); font-weight: 500; }
  .match-venue { margin-top: 8px; font-size: 11px; color: var(--text3); text-align: center; }
  .goals-row { margin-top: 8px; font-size: 11px; color: var(--text2); display: flex; justify-content: space-between; gap: 8px; }
  .goals-home { text-align: right; flex: 1; }
  .goals-away { text-align: left; flex: 1; }
  .goal-scorer { display: block; }

  .loading { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 13px; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; font-size: 12px; color: var(--text3); margin-top: 20px; }
  footer a { color: var(--text2); margin: 0 8px; }

<script>
const API_GAMES    = 'https://worldcup26.ir/get/games';
const API_STADIUMS = 'https://worldcup26.ir/get/stadiums';

const FLAGS = {
  'Mexico':'🇲🇽','South Africa':'🇿🇦','South Korea':'🇰🇷','Czech Republic':'🇨🇿',
  'Canada':'🇨🇦','Bosnia & Herzegovina':'🇧🇦','Qatar':'🇶🇦','Switzerland':'🇨🇭',
  'Brazil':'🇧🇷','Morocco':'🇲🇦','Haiti':'🇭🇹','Scotland':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','Australia':'🇦🇺',
  'Türkiye':'🇹🇷','Germany':'🇩🇪','Curaçao':'🇨🇼','Netherlands':'🇳🇱','Japan':'🇯🇵',
  'Ivory Coast':'🇨🇮','Ecuador':'🇪🇨','Sweden':'🇸🇪','Tunisia':'🇹🇳','Spain':'🇪🇸',
  'Cape Verde':'🇨🇻','Belgium':'🇧🇪','Egypt':'🇪🇬','Saudi Arabia':'🇸🇦','Uruguay':'🇺🇾',
  'Iran':'🇮🇷','New Zealand':'🇳🇿','France':'🇫🇷','Senegal':'🇸🇳','Iraq':'🇮🇶',
  'Norway':'🇳🇴','Argentina':'🇦🇷','Algeria':'🇩🇿','Austria':'🇦🇹','Jordan':'🇯🇴',
  'Portugal':'🇵🇹','DR Congo':'🇨🇩','England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Croatia':'🇭🇷','Ghana':'🇬🇭',
  'Panama':'🇵🇦','Uzbekistan':'🇺🇿','Colombia':'🇨🇴','USA':'🇺🇸','Paraguay':'🇵🇾','United States':'🇺🇸',
};
function flag(t) { return FLAGS[t] || '🏳'; }

function formatDate(d) {
  return new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function isToday(d) {
  return new Date(d + 'T12:00:00Z').toDateString() === new Date().toDateString();
}

function parseLocalDate(localDate) {
  if (!localDate) return { dateStr: null, timeStr: null };
  const [datePart, timePart] = localDate.split(' ');
  const [mm, dd, yyyy] = datePart.split('/');
  return { dateStr: `${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`, timeStr: timePart || null };
}

function parseScorers(raw) {
  if (!raw || raw === 'null' || raw === '{}') return [];
  const result = [];
  const re = /"([^"]+)"/g;
  let m;
  while ((m = re.exec(raw)) !== null) {
    const entry = m[1].trim();
    const mm = entry.match(/^(.+?)\s+(\d+(?:\+\d+)?)'?$/);
    if (mm) result.push({ name: mm[1].trim(), minute: mm[2] });
    else result.push({ name: entry, minute: '?' });
  }
  return result;
}

function normalizeGame(g, stadiumsMap) {
  const { dateStr, timeStr } = parseLocalDate(g.local_date);
  const finished = g.finished === 'TRUE';
  const te = g.time_elapsed;
  const isLive = !finished && te && te !== 'notstarted' && te !== 'finished';
  const stadium = stadiumsMap[g.stadium_id];
  const norm = {
    team1: g.home_team_name_en,
    team2: g.away_team_name_en,
    date: dateStr,
    time: timeStr,
    ground: stadium ? `${stadium.name_en}, ${stadium.city_en}` : null,
    group: g.type === 'group' ? `Group ${g.group}` : null,
    status: finished ? 'finished' : (isLive ? 'live' : 'upcoming'),
    liveMinute: isLive ? te : null,
    goals1: parseScorers(g.home_scorers),
    goals2: parseScorers(g.away_scorers),
  };
  if (finished || isLive) {
    norm.score = { ft: [parseInt(g.home_score) || 0, parseInt(g.away_score) || 0] };
  }
  return norm;
}

let allMatches = [], currentFilter = 'all';

function renderAll(matches) {
  const container = document.getElementById('main-content');
  if (!matches.length) {
    container.innerHTML = '<div class="loading">No matches found.</div>';
    return;
  }
  const byDate = {};
  matches.forEach(m => {
    if (!byDate[m.date]) byDate[m.date] = [];
    byDate[m.date].push(m);
  });
  let html = '';
  Object.keys(byDate).sort().forEach(date => {
    html += `<div class="day-group"><div class="day-label">${formatDate(date)}${isToday(date) ? ' — TODAY' : ''}</div>`;
    byDate[date].forEach(m => {
      const isLive = m.liveMinute != null;
      const hasScore = m.score && m.score.ft;
      const today = isToday(m.date);
      const cls = isLive ? 'live-match' : (hasScore ? 'completed' : (today ? 'live-match' : 'upcoming'));
      const statusLabel = isLive ? `🔴 ${m.liveMinute}'` : (hasScore ? 'FT' : (today ? 'TODAY' : (m.time || 'TBC')));
      const statusCls = isLive ? 'status-live' : (hasScore ? 'status-ft' : 'status-upcoming');
      const g1 = (m.goals1||[]).map(g => `<span class="goal-scorer">${g.name} ${g.minute}'</span>`).join('');
      const g2 = (m.goals2||[]).map(g => `<span class="goal-scorer">${g.name} ${g.minute}'</span>`).join('');
      html += `<article class="match-card ${cls}">
        <div class="match-meta">
          <span class="match-group">${m.group || 'Knockout Stage'}</span>
          <span class="match-status ${statusCls}">${statusLabel}</span>
        </div>
        <div class="match-teams">
          <div class="team-name home">${flag(m.team1)} ${m.team1}</div>
          ${hasScore
            ? `<div class="score-box"><div class="score-value">${m.score.ft[0]} – ${m.score.ft[1]}</div></div>`
            : `<div class="score-box"><div class="score-vs">vs</div></div>`}
          <div class="team-name away">${m.team2} ${flag(m.team2)}</div>
        </div>
        ${m.ground ? `<div class="match-venue">📍 ${m.ground}</div>` : ''}
        ${hasScore && (g1||g2) ? `<div class="goals-row"><div class="goals-home">${g1}</div><div class="goals-away">${g2}</div></div>` : ''}
      </article>`;
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

function applyFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => {
    const active = t.dataset.filter === f;
    t.classList.toggle('active', active);
    t.setAttribute('aria-pressed', String(active));
  });
  let filtered = allMatches;
  if (f === 'results') filtered = allMatches.filter(m => m.score);
  if (f === 'upcoming') filtered = allMatches.filter(m => m.status === 'upcoming');
  if (f === 'today') filtered = allMatches.filter(m => isToday(m.date));
  renderAll(filtered);
}

document.getElementById('filter-tabs').addEventListener('click', e => {
  if (e.target.dataset.filter) applyFilter(e.target.dataset.filter);
});

async function loadData() {
  try {
    const [gamesRes, stadiumsRes] = await Promise.all([
      fetch(API_GAMES + '?t=' + Date.now()),
      fetch(API_STADIUMS)
    ]);
    if (!gamesRes.ok) throw new Error('HTTP ' + gamesRes.status);
    const gamesData = await gamesRes.json();

    const stadiumsMap = {};
    if (stadiumsRes.ok) {
      const sd = await stadiumsRes.json();
      const list = Array.isArray(sd) ? sd : (sd.stadiums || []);
      list.forEach(s => { stadiumsMap[s.id] = s; });
    }

    const raw = Array.isArray(gamesData) ? gamesData : (gamesData.games || []);
    allMatches = raw
      .map(g => normalizeGame(g, stadiumsMap))
      .filter(m => m.team1 && m.team2 && m.date)
      .sort((a, b) => a.date !== b.date ? (a.date < b.date ? -1 : 1) : (a.time || '') < (b.time || '') ? -1 : 1);

    applyFilter(currentFilter);
  } catch(err) {
    document.getElementById('main-content').innerHTML =
      '<div class="loading">⚠ Could not load live data. <button onclick="loadData()" style="color:var(--accent);background:none;border:none;cursor:pointer;">Retry</button></div>';
    console.error('WorldCup26 matches load error:', err);
  }
}
loadData();
setInterval(loadData, 60000);
</script>
